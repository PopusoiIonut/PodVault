name: PodVault
targets:
  PodVault:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        UIRequiresFullScreen: YES
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        DEVELOPMENT_TEAM: M9NL4PJ9AL
        PRODUCT_BUNDLE_IDENTIFIER: com.popusoiionut.PodVault
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ACCENT_COLOR_NAME: AccentColor
