name: PodVault
packages:
  WalletConnect:
    url: https://github.com/WalletConnect/WalletConnectSwiftV2
    from: 1.0.0

targets:
  PodVault:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        UIRequiresFullScreen: YES
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: WalletConnect
        product: WalletConnectModal
      - package: WalletConnect
        product: WalletConnectPairing
    settings:
      base:
        DEVELOPMENT_TEAM: M9NL4PJ9AL
        PRODUCT_BUNDLE_IDENTIFIER: com.popusoiionut.PodVault
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ACCENT_COLOR_NAME: AccentColor
